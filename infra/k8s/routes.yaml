# ---------------------------------------------------------------------------
# HTTPRoutes - the routing half of the old Ingress object, now one resource
# per concern so each service team can own its own routes.
# Precedence is decided by the spec (Exact > RegularExpression > PathPrefix,
# then longest path, then method match), NOT by file or rule order.
# ---------------------------------------------------------------------------

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route # writes go to the posts service (the command side)
spec:
  parentRefs:
    - name: quickticket-gateway # attach to the Gateway defined in gateway.yaml
  rules:
    - matches:
        - path:
            type: Exact # match only /post, not /post/anything
            value: /api/users/?(.*) # the ? makes the trailing slash optional
          method: POST # method matching is why we no longer need a separate URL for the write side
      backendRefs:
        - name: auth-srv # the ClusterIP Service in auth-depl.yaml
          port: 3000 # must match the Service's port, not the container port