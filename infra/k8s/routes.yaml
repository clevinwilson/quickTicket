# ---------------------------------------------------------------------------
# HTTPRoutes - the routing half of the old Ingress object, one resource per
# concern so each service owns its own routes.
#
# Precedence is decided by the spec (Exact > RegularExpression > PathPrefix,
# then longest path, then method match), NOT by file or rule order.
#
# Note on match types: `Exact` and `PathPrefix` are literal string matches -
# they are NOT regex. A regex needs type: RegularExpression, which is only
# implementation-specific support, so prefer PathPrefix where it will do.
# ---------------------------------------------------------------------------

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route
spec:
  parentRefs:
    - name: quickticket-gateway # attach to the Gateway defined in gateway.yaml
  rules:
    # PathPrefix matches /api/users and everything beneath it, so /register,
    # /login and any future sub-route all reach the service. No `method:`
    # filter here on purpose: Express already dispatches by verb, and listing
    # methods at the gateway means infra edits every time a route is added.
    - matches:
        - path:
            type: PathPrefix
            value: /api/users
      backendRefs:
        - name: auth-srv # the ClusterIP Service in auth-depl.yaml
          port: 3000 # the Service's port, not the container port
